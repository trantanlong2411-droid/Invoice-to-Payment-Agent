name: Invoice-to-Payment Agent — parser, safety and Worker build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test text + JSON invoices, mismatch flags, on-chain safety and reference metadata
        run: npm test
      - name: Bundle Cloudflare Worker
        run: npm run build
