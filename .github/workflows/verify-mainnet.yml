name: Invoice-to-Payment Agent — direct Pharos Mainnet audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-mainnet.mjs'
      - '.github/workflows/verify-mainnet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pharos-real-invoice-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate two actual invoice reviews and unsigned USDC on mainnet
        run: node scripts/verify-mainnet.mjs
      - name: Archive original mainnet evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-to-payment-direct-mainnet-proof
          path: proof/direct-mainnet-invoice.json
          retention-days: 30
          if-no-files-found: error
