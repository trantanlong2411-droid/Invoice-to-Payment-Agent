name: Invoice-to-Payment Agent — deployed Worker end-to-end verification
# Re-run against production after Cloudflare Workers Builds reported Success.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/smoke-deployed.mjs'
      - '.github/workflows/verify-deployed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-invoice-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test actual published Worker, 2 formats and invoice-linked unsigned USDC
        run: node scripts/smoke-deployed.mjs
      - name: Archive actual Pharos RPC response evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-to-payment-live-mainnet-proof
          path: proof/live-invoice-worker.json
          retention-days: 30
          if-no-files-found: error
